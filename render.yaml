services:
  - type: web
    name: mali-audio-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: mali-audio-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mali-audio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STREAM_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://faguimba223.github.io
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PRIVATE_STORAGE_DIR
        value: /var/data/storage/private
      - key: DEFAULT_ADMIN_ENABLED
        value: 'true'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

databases:
  - name: mali-audio-db
    region: frankfurt
    plan: 0.5c-1g
    databaseName: maliaudio
    user: mali_audio
    diskSizeGB: 10
